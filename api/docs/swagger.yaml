  /v1/me:
    delete:
      description: |-
        - a soft delete: the user disappears from reads and their username and phone number can be used again
        - their tokens are removed at once, so the access token used here stops working
        - their children go too, unless another parent still has the child
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: deletes the signed-in user's account
      tags:
      - me
    get:
      description: '- the user row plus the current role (user, paid_user or admin)
        and plan (free or pro)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.profileView'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: the signed-in user's profile
      tags:
      - me
    patch:
      consumes:
      - application/json
      description: |-
        - only the fields present in the body change; omitted or null fields are kept
        - "" clears name, username or photo_id; phone_number cannot be cleared
        - name: at most 100 characters; username: 3 to 32 of a-z, 0-9, '_' or '.' (lowercased);
        photo_id: an id from POST /v1/media (422 if unknown)
        - a new phone_number must be an Uzbek number (+998 and 9 digits) verified first:
        POST /v1/otp/send and /v1/otp/verify with purpose update_user for the new number (403 otherwise);
        the change uses the verification up. Sending the current number is not a change
        - username or phone number already used by someone else: 409
      parameters:
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.profileView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: edits the signed-in user's profile partially
      tags:
      - me
  /v1/me/articles:
    get:
      description: One item per day the user opened the daily article. Deleted articles
