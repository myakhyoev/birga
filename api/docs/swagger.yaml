  /v1/children/{id}/today/difficulty:
    post:
      consumes:
      - application/json
      description: |-
        "Osonroq / Odatdagi / Qiyinroq" on the activity page. activity_id is today's open plan
        activity or an added activity not done yet. The backend picks another published
        activity of that difficulty for the child's age and the same goal (the plan day's goal,
        or one of the added activity's goals), never the current one, a plan day or one already in
        today's list, so asking for the level it already has gives another activity of that level.
        The new activity takes the item's place: done on the plan day it keeps the streak.
        - 403 without Birga Pro
        - 404 when the activity is not in today's list, or no activity of that difficulty is left
        - 409 when the item is already done today
        - 422 for a difficulty other than easy, normal, difficult
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: activity and level
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.ChangeTodayDifficultyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: swaps an activity of today's list for one of another difficulty (Birga
        Pro)
      tags:
      - children
  /v1/children/{id}/today/extras:
    post:
      consumes:
      - application/json
      description: |-
        - goal_id: picks a published activity for the child's age that serves the goal and is
        not in today's list yet, never-done ones first (404 when none is left)
        - activity_id: adds that published activity (404 for an unknown or unpublished one)
        - adding an activity already in the list returns it; at most 10 a day (422)
        - mark it done with POST /v1/children/{id}/completions; it does not count toward the streak
        - 403 without Birga Pro
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: goal_id or activity_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.AddTodayExtraRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.todayExtraView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: adds an activity to a child's list for today (Birga Pro)
      tags:
      - children
