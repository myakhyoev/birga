basePath: /
definitions:
  rest.BadRequestResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -11
      error_note:
        example: limit must be a positive integer
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.ConflictResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -40
      error_note:
        example: username is already taken
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.CreateActivityRequest:
    properties:
      description_ru:
        example: Сортируйте камни по цвету
        type: string
      description_uz:
        example: Toshlarni rangi bo'yicha saralang
        type: string
      duration_minutes:
        example: 10
        maximum: 60
        minimum: 1
        type: integer
      goal:
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        example: cognitive
        type: string
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        maximum: 6
        minimum: 2
        type: integer
      min_age:
        example: 3
        maximum: 6
        minimum: 2
        type: integer
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
    type: object
  rest.CreateUserRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.ForbiddenResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -21
      error_note:
        example: phone number is not verified, verify a sign_up code with /v1/otp/verify
          first
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.InternalServerErrorResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -50
      error_note:
        example: internal error
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.NotFoundResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -30
      error_note:
        example: activity not found
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.R:
    properties:
      data: {}
      error_code:
        $ref: '#/definitions/rest.errCode'
      error_note:
        type: string
      status:
        $ref: '#/definitions/rest.statusType'
    type: object
  rest.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  rest.SendOTPRequest:
    properties:
      ip_address:
        example: 203.0.113.7
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      purpose:
        enum:
        - sign_up
        - update_user
        example: sign_up
        type: string
    type: object
  rest.ServiceUnavailableResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -60
      error_note:
        example: database unavailable
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.SignUpRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      password:
        example: s3cret-pass
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      user_role:
        description: UserRole is optional and defaults to user; admin is refused with
          403.
        enum:
        - user
        - paid_user
        example: user
        type: string
      username:
        example: dilnoza_k
        type: string
    type: object
  rest.TooManyRequestsResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -70
      error_note:
        example: a code was sent recently, request a new one in 42 seconds
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UnauthorizedResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -20
      error_note:
        example: unauthorized
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UnprocessableContentResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -10
      error_note:
        example: unknown goal "flying"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UpdateUserRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.VerifyOTPRequest:
    properties:
      code:
        example: "480569"
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      purpose:
        enum:
        - sign_up
        - update_user
        example: sign_up
        type: string
    type: object
  rest.accessTokenView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 900
        type: integer
    type: object
  rest.activityListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.activityView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  rest.activityView:
    properties:
      created_at:
        type: string
      description_ru:
        type: string
      description_uz:
        type: string
      duration_minutes:
        example: 10
        type: integer
      goal:
        example: cognitive
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        type: integer
      min_age:
        example: 3
        type: integer
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
      updated_at:
        type: string
    type: object
  rest.errCode:
    enum:
    - 0
    - -10
    - -11
    - -20
    - -21
    - -30
    - -40
    - -50
    - -60
    - -70
    type: integer
    x-enum-comments:
      _errCodeBadRequest: for http 400
      _errCodeConflict: for http 409
      _errCodeForbidden: for http 403
      _errCodeInternalErr: for http 500
      _errCodeNoError: Success code.
      _errCodeNotFound: for http 404
      _errCodeRateLimited: for http 429
      _errCodeUnauthorized: for http 401
      _errCodeUnavailable: for http 503
      _errCodeValidation: for http 422
    x-enum-descriptions:
    - Success code.
    - for http 422
    - for http 400
    - for http 401
    - for http 403
    - for http 404
    - for http 409
    - for http 500
    - for http 503
    - for http 429
    x-enum-varnames:
    - _errCodeNoError
    - _errCodeValidation
    - _errCodeBadRequest
    - _errCodeUnauthorized
    - _errCodeForbidden
    - _errCodeNotFound
    - _errCodeConflict
    - _errCodeInternalErr
    - _errCodeUnavailable
    - _errCodeRateLimited
  rest.mediaView:
    properties:
      content_type:
        example: image/jpeg
        type: string
      id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      size:
        description: bytes
        example: 183244
        type: integer
      url:
        example: https://birga-media.s3.eu-central-1.amazonaws.com/media/3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f.jpg
        type: string
    type: object
  rest.sendOTPView:
    properties:
      expires_in:
        description: seconds until the code expires
        example: 180
        type: integer
      resend_in:
        description: seconds until a new code may be requested
        example: 60
        type: integer
    type: object
  rest.statusType:
    enum:
    - Success
    - Failure
    type: string
    x-enum-varnames:
    - _statusSuccess
    - _statusFailure
  rest.tokenPairView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 900
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  rest.userListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.userView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  rest.userView:
    properties:
      created_at:
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      updated_at:
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
info:
  contact: {}
  description: Backend for the Birga caregiver app.
  title: Birga API
  version: v1
paths:
  /health:
    get:
      description: Checks that the database is reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: readiness probe
      tags:
      - system
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
      summary: liveness probe
      tags:
      - system
  /v1/activities:
    get:
      parameters:
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: development goal
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        in: query
        name: goal
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: lists published activities
      tags:
      - activities
  /v1/activities/{id}:
    get:
      parameters:
      - description: activity id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: returns a published activity
      tags:
      - activities
  /v1/admin/activities:
    get:
      parameters:
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: development goal
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        in: query
        name: goal
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: lists all activities, including unpublished
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: |-
        - title/description are required in both Uzbek (uz) and Russian (ru)
        - goal is one of: language, motor, cognitive, social, emotional
        - min_age/max_age are child ages in years, within 2..6
      parameters:
      - description: activity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: creates an activity
      tags:
      - admin
  /v1/admin/activities/{id}:
    get:
      parameters:
      - description: activity id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: returns an activity, including unpublished
      tags:
      - admin
  /v1/admin/users:
    get:
      parameters:
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.userListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: lists users (soft-deleted users are excluded)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: |-
        - phone_number is required, in E.164 format (+998901234567)
        - username is optional: 3..32 latin letters, digits, '_' or '.'; stored lowercase
        - name is optional, at most 100 characters; photo_id is an optional id from POST /v1/media (422 if unknown)
        - username and phone_number must be unique among non-deleted users (409)
      parameters:
      - description: user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.userView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: creates a user
      tags:
      - admin
  /v1/admin/users/{id}:
    delete:
      description: |-
        Sets deleted_at; the user disappears from reads, their tokens are removed,
        and their username and phone number can be used again.
      parameters:
      - description: user id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: soft-deletes a user
      tags:
      - admin
    get:
      parameters:
      - description: user id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.userView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: returns a user
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: |-
        - only the fields present in the body change; omitted or null fields are kept
        - "" clears name, username or photo_id; phone_number cannot be cleared
        - same format and uniqueness rules as create
      parameters:
      - description: user id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.userView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: updates a user partially
      tags:
      - admin
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        - refresh_token must be signed by this API, unexpired, of type refresh, and still the
        one stored for the user (a deleted user's token stops working); otherwise 401
        - the refresh token is not rotated; keep using it until it expires
      parameters:
      - description: refresh token from sign-up
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.accessTokenView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: trades a refresh token for a new access token
      tags:
      - auth
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        - the phone number must be verified first: POST /v1/otp/send and /v1/otp/verify with
        purpose sign_up; the verification lasts OTP_VERIFIED_TTL (default 10 minutes) and is
        used up by a successful sign-up. Not verified: 403
        - name: 1 to 100 characters; username: 3 to 32 of a-z, 0-9, '_' or '.' (lowercased);
        password: 8 to 72 bytes, stored as a bcrypt hash; phone_number: +998 and 9 digits (422)
        - user_role: user (default when omitted) or paid_user; admin cannot be chosen here (403),
        anything else is 422. Stored in user_auth.role and written into the tokens as the role claim
        - username or phone number already used: 409
        - access_token (JWT_ACCESS_TTL, default 15 minutes) and refresh_token (JWT_REFRESH_TTL,
        default 30 days) are HS256 JWTs; send the access token as Authorization: Bearer <token>
      parameters:
      - description: new user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.SignUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.tokenPairView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: creates a user and returns their tokens
      tags:
      - auth
  /v1/media:
    post:
      consumes:
      - multipart/form-data
      - application/x-www-form-urlencoded
      description: |-
        - send form data (multipart/form-data or application/x-www-form-urlencoded) with one field "file":
        either the file itself (multipart file part) or the file as a base64 string; a data URL
        prefix such as "data:image/png;base64," is allowed
        - accepted: JPEG, PNG or WebP, detected from the bytes, not from the file name (422 otherwise)
        - at most MEDIA_MAX_SIZE bytes after decoding, default 5 MiB (422 otherwise)
        - the answer's id goes into users.photo_id (PATCH /v1/admin/users/{id} {"photo_id": id});
        url is where clients load the image from
        - 503 when S3 is not configured (S3_BUCKET empty)
      parameters:
      - description: 'the image: a file part, or a base64 string in the same field'
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.mediaView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: uploads an image (a profile photo) to S3
      tags:
      - media
  /v1/otp/send:
    post:
      consumes:
      - application/json
      description: |-
        - phone_number: an Uzbek mobile number in E.164, +998 and 9 digits (422 otherwise)
        - purpose: sign_up (the number must not belong to a user, 409 otherwise) or update_user
        - ip_address: the end user's IPv4 or IPv6 address, used for rate limits
        - the code has 6 digits and is sent through Play Mobile; only its hash is stored
        - the code is kept in Redis for expires_in seconds (OTP_TTL, default 2 minutes); a new
        code replaces the previous one for the same phone and purpose
        - rate limiter (429): one code per phone and purpose per resend_in seconds, and per hour
        at most OTP_MAX_PER_PHONE_HOUR codes per phone and OTP_MAX_PER_IP_HOUR per IP
      parameters:
      - description: where and why to send the code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.sendOTPView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/rest.TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: sends a one-time code by SMS
      tags:
      - otp
  /v1/otp/verify:
    post:
      consumes:
      - application/json
      description: |-
        - phone_number and purpose must be the ones the code was sent for; code is 6 digits (422)
        - a matching code is deleted, so it works only once; data is null
        - wrong code: 422 with the attempts left; after OTP_MAX_VERIFY_ATTEMPTS wrong codes the
        code is deleted and the answer is 429
        - no code (never sent, expired after 2 minutes, or already used): 404
      parameters:
      - description: code to check
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/rest.TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: checks a one-time code
      tags:
      - otp
securityDefinitions:
  AdminKey:
    in: header
    name: X-Admin-Key
    type: apiKey
swagger: "2.0"
