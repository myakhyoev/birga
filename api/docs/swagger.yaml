  /v1/me/articles/daily:
    get:
      description: |-
        The article is picked once per day (Uzbekistan time) and stays the same all day.
        It prefers, in order: an article for one of the goals of the user's children, whose age range
        fits one of the children, not shown or read before, then rotates through the goals.
        tomorrow is the article that will show tomorrow ("Ertangi maqola"); null when there is no other article.
        404 when no article is published.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.dailyArticleView'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: returns the signed-in user's article of the day, and tomorrow's
      tags:
      - articles
  /v1/me/children:
    get:
      description: |-
        - only children linked to the caller; deleted children are left out
        - GET /v1/children/{id} returns one of them
      parameters:
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.childListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: lists the signed-in user's children, newest first
      tags:
      - me
  /v1/me/password:
    put:
      consumes:
      - application/json
      description: |-
        - first POST /v1/otp/send and /v1/otp/verify with purpose reset_password for the
        user's own phone number; without that verification: 403. A successful reset uses it up
        - password: 8 to 72 bytes, stored as a bcrypt hash (422)
        - returns a new token pair; every token issued before, on any device, stops working
      parameters:
      - description: new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.tokenPairView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: sets a new password for the signed-in user, confirmed by an SMS code
      tags:
      - me
  /v1/me/posts:
    get:
      description: One item per day the user opened the daily video. Deleted posts
        are left out.
      parameters:
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.dailyPostListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: lists the signed-in user's daily videos of earlier days and today,
        newest first
      tags:
      - posts
  /v1/me/posts/daily:
    get:
      description: |-
        The video is picked once per day (Uzbekistan time) and stays the same all day, the same way as the
        daily article: a goal of the user's children first, an age that fits a child, not shown before, then
        rotating through the goals. next lists up to 2 videos that would come next, without the video, for
        the locked "Keyingi videolar" list. 404 when no video is published.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.dailyPostView'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: returns the signed-in user's video of the day ("Kun videosi")
      tags:
      - posts
  /v1/me/tips/daily:
    get:
      description: |-
        The tip is picked once per day (Uzbekistan time) and stays the same all day. It prefers a tip whose
        age range fits one of the user's children, not shown before, then the one shown longest ago, rotating
        through the topics. 404 when no tip is published.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.dailyTipView'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: returns the signed-in user's tip of the day ("Kun maslahati")
      tags:
      - tips
  /v1/media:
    post:
      consumes:
      - multipart/form-data
      - application/x-www-form-urlencoded
      description: |-
        - send form data (multipart/form-data or application/x-www-form-urlencoded) with one field "file":
        either the file itself (multipart file part) or the file as a base64 string; a data URL
        prefix such as "data:image/png;base64," is allowed
        - accepted: JPEG, PNG or WebP, detected from the bytes, not from the file name (422 otherwise)
        - at most MEDIA_MAX_SIZE bytes after decoding, default 100 MiB (422 otherwise)
        - optional field "kind": profile (default here) or content; it decides the sizes the
        server makes in the background (see GET /v1/media/{id}?size=)
        - optional field "crop": "x,y,w,h", the frame the user chose, in fractions (0-1) of the
        upright photo's width and height; without it the centre is used
        - the answer's id goes into users.photo_id (PATCH /v1/admin/users/{id} {"photo_id": id});
        url is where clients load the image from: GET /v1/media/{id} on this API
        - 503 when S3 is not configured (S3_BUCKET empty)
      parameters:
      - description: 'the image: a file part, or a base64 string in the same field'
        in: formData
        name: file
        required: true
        type: file
      - description: profile (default) or content
        enum:
        - profile
        - content
        in: formData
        name: kind
        type: string
      - description: chosen frame x,y,w,h in fractions of the photo, e.g. 0,0.1,1,0.8
        in: formData
        name: crop
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.mediaView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: uploads an image (a profile photo) to S3
      tags:
      - media
  /v1/media/{id}:
    get:
      description: |-
        - redirects (302) to a short-lived signed link to the image in the private S3 bucket
        (valid MEDIA_LINK_TTL, default 1 hour); image widgets follow it on their own
        - size: original (default), main, thumb or small. Content photos (activities, articles,
        video covers): main 1200x600, thumb 400x200, small 240x240 (centre square). Profile photos:
        main 800x800, thumb 250x250 (small gives thumb). Sizes are made in the background a few
        seconds after the upload; until then, and for videos, the link opens the original
        - header X-Media-Variant says which one the redirect opens (the size, or "original")
        - needs no token, so <img> and Image.network work; ids are random UUIDs
        - unknown id: 404; S3 not configured: 503
      parameters:
      - description: media id (photo_id)
        in: path
        name: id
        required: true
        type: string
      - description: original (default), main, thumb or small
        enum:
        - original
        - main
        - thumb
        - small
        in: query
        name: size
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: opens an uploaded image (or one of its sizes)
      tags:
      - media
  /v1/milestones/{id}:
    get:
      description: |-
        With child_id (one of the caller's children) it says whether the child achieved it. activities are the
        related published activities. Without Birga Pro the advice fields are empty and activities is [].
      parameters:
      - description: milestone id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: one of the caller's children
        in: query
        name: child_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.milestoneDetailView'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: returns one published milestone with its advice ("Maslahat")
      tags:
      - milestones
  /v1/otp/send:
    post:
      consumes:
      - application/json
      description: |-
        - phone_number: an Uzbek mobile number in E.164, +998 and 9 digits (422 otherwise)
        - purpose: sign_up (the number must not belong to a user, 409 otherwise), update_user, or
        reset_password (the number must belong to a user, 404 otherwise; used by forgot password and
        PUT /v1/me/password)
        - the User-Agent header is required (422 if empty) and identifies the client for rate limits;
        an old client's ip_address field is ignored
        - the code has 6 digits and is sent through Play Mobile; only its hash is stored
        - the code is kept in Redis for expires_in seconds (OTP_TTL, default 2 minutes); a new
        code replaces the previous one for the same phone and purpose
        - rate limiter (429): one code per phone and purpose per resend_in seconds, and per hour
        at most OTP_MAX_PER_PHONE_HOUR codes per phone and OTP_MAX_PER_USER_AGENT_HOUR per User-Agent
      parameters:
      - description: where and why to send the code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.sendOTPView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/rest.ConflictResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/rest.TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: sends a one-time code by SMS
      tags:
      - otp
  /v1/otp/verify:
    post:
      consumes:
      - application/json
      description: |-
        - phone_number and purpose must be the ones the code was sent for; code is 6 digits (422)
        - a matching code is deleted, so it works only once; data is null
        - wrong code: 422 with the attempts left; after OTP_MAX_VERIFY_ATTEMPTS wrong codes the
        code is deleted and the answer is 429
        - no code (never sent, expired after 2 minutes, or already used): 404
        - OTP_DEFAULT_CODE, when configured (never in production), is accepted for any phone
        and purpose without checking
      parameters:
      - description: code to check
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/rest.TooManyRequestsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: checks a one-time code
      tags:
      - otp
  /v1/posts:
    get:
      description: Every signed-in user may browse the titles; opening a video follows
        the rules of GET /v1/posts/{id}.
      parameters:
      - description: text the title (any language) contains, ignoring case (at most
          100 characters)
        in: query
        name: q
        type: string
      - description: goal id (UUID) from GET /v1/goals
        in: query
        name: goal_id
        type: string
      - description: topic id (UUID) from GET /v1/topics
        in: query
        name: topic_id
        type: string
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: at most this many minutes
        in: query
        name: max_minutes
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.postTeaserListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: lists published video posts as previews, without the video
      tags:
      - posts
  /v1/posts/{id}:
    get:
      description: |-
        Users without Birga Pro may open only posts that were their daily video, today or earlier
        (403 otherwise); Pro users may open every published post.
      parameters:
      - description: post id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.postView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest.ForbiddenResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: returns a published video post with its video
      tags:
      - posts
  /v1/pro:
    get:
      description: Pro is turned on with POST /v1/pro/purchase (no real payment yet)
        or by an admin with PUT /v1/admin/users/{id}/pro.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.proOfferView'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: 'the Birga Pro offer: price and the caller''s plan'
      tags:
      - pro
  /v1/pro/purchase:
    post:
      consumes:
      - application/json
      description: |-
        There is no payment integration yet: nothing is charged (paid is false). The call adds one month to
        pro_until, counted from the current end of Pro or from now, and takes effect on the next request.
        payment_method is payme or click (422 otherwise).
      parameters:
      - description: payment type
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.PurchaseProRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.proPurchaseView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: 'the "To‘lash" button: turns on Birga Pro for one month (no real payment
        yet)'
      tags:
      - pro
  /v1/tips:
    get:
      description: For a user without Birga Pro, every tip that was never their daily
        tip has locked=true and empty texts.
      parameters:
      - description: text the tip (any language) contains, ignoring case (at most
          100 characters)
        in: query
        name: q
        type: string
      - description: topic id (UUID) from GET /v1/topics
        in: query
        name: topic_id
        type: string
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.tipListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: lists published tips (Kutubxona > Maslahat)
      tags:
      - tips
  /v1/topics:
    get:
      description: 'Open without a token. Not paginated: the list is short.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/rest.topicView'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: lists the active topics (tags of tips, articles and videos), oldest
        first
      tags:
      - topics
securityDefinitions:
  AdminKey:
    in: header
    name: X-Admin-Key
    type: apiKey
  BearerAuth:
    description: Access token from /v1/auth/signup or /v1/auth/refresh, as "Bearer
      <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
