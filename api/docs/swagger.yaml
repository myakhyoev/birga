          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: a child's streak and progress
      tags:
      - children
  /v1/children/{id}/streak/days:
    get:
      description: |-
        - one entry per day from from to to (both inclusive, YYYY-MM-DD), oldest first, skipping
        days before the child's first plan started and days after today
        - status: done (a plan day was done), missed (no plan day done that day), today (today,
        nothing done yet: not missed until the day is over); days are Uzbekistan time (UTC+5)
        - from and to are optional: without them, the last 28 days up to today; at most 366
        days, and from must not be after to (422)
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: first day, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: last day, YYYY-MM-DD (default today)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/rest.streakDayView'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: 'a child''s streak calendar: done and missed days'
      tags:
      - children
  /v1/children/{id}/today:
    get:
      description: |-
        "Bugungi reja": the plan activity of the day and the activities a Pro parent added.
        - plan is the open plan day (status today) or the plan day done today (status done);
        null when neither exists (the plan is done, or no activity fits the child's age)
        - extras are the added activities, oldest first, each with done
        - done_count counts the done items of the list
        - only the child's parents can ask (404 otherwise)
      parameters:
      - description: child id (UUID)
        in: path
        name: id
        required: true
