info:
  contact: {}
  description: Backend for the Birga caregiver app.
  title: Birga API
  version: v1
paths:
  /health:
    get:
      description: Checks that the database is reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: readiness probe
      tags:
      - system
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
      summary: liveness probe
      tags:
      - system
  /v1/activities:
    get:
      parameters:
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: goal id (UUID) from GET /v1/goals
        in: query
        name: goal_id
        type: string
      - description: text the Uzbek or Russian title contains, ignoring case (at most
          100 characters)
        in: query
        name: q
        type: string
      - description: only activities of this level
        enum:
        - easy
        - normal
        - difficult
        in: query
        name: difficulty
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
