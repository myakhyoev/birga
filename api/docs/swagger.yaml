basePath: /
definitions:
  domain.UserRole:
    enum:
    - user
    - admin
    - paid_user
    type: string
    x-enum-varnames:
    - UserRoleUser
    - UserRoleAdmin
    - UserRolePaidUser
  rest.BadRequestResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -11
      error_note:
        example: limit must be a positive integer
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.CompleteActivityRequest:
    properties:
      activity_id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      note:
        description: caregiver's reflection, optional
        example: Qizil rangni birinchi topdi
        type: string
    type: object
  rest.ConflictResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -40
      error_note:
        example: username is already taken
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.CreateActivityRequest:
    properties:
      description_ru:
        example: Сортируйте камни по цвету
        type: string
      description_uz:
        example: Toshlarni rangi bo'yicha saralang
        type: string
      duration_minutes:
        example: 10
        maximum: 60
        minimum: 1
        type: integer
      goal:
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        example: cognitive
        type: string
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        maximum: 6
        minimum: 2
        type: integer
      min_age:
        example: 3
        maximum: 6
        minimum: 2
        type: integer
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
    type: object
  rest.CreateChildRequest:
    properties:
      age:
        example: 4
        type: integer
      gender:
        enum:
        - male
        - female
        example: male
        type: string
      name:
        example: Amir
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
    type: object
  rest.CreateUserRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.ForbiddenResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -21
      error_note:
        example: phone number is not verified, verify a sign_up code with /v1/otp/verify
          first
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.ForgotPasswordRequest:
    properties:
      password:
        example: n3w-s3cret-pass
        type: string
      phone_number:
        example: "+998901234567"
        type: string
    type: object
  rest.InternalServerErrorResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -50
      error_note:
        example: internal error
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.LoginRequest:
    properties:
      password:
        example: s3cret-pass
        type: string
      username:
        example: dilnoza_k
        type: string
    type: object
  rest.NotFoundResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -30
      error_note:
        example: activity not found
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.R:
    properties:
      data: {}
      error_code:
        $ref: '#/definitions/rest.errCode'
      error_note:
        type: string
      status:
        $ref: '#/definitions/rest.statusType'
    type: object
  rest.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  rest.ResetPasswordRequest:
    properties:
      password:
        example: n3w-s3cret-pass
        type: string
    type: object
  rest.SendOTPRequest:
    properties:
      ip_address:
        example: 203.0.113.7
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      purpose:
        enum:
        - sign_up
        - update_user
        - reset_password
        example: sign_up
        type: string
    type: object
  rest.ServiceUnavailableResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -60
      error_note:
        example: database unavailable
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.SignUpRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      password:
        example: s3cret-pass
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      user_role:
        description: UserRole is optional and defaults to user; admin is refused with
          403.
        enum:
        - user
        - paid_user
        example: user
        type: string
      username:
        example: dilnoza_k
        type: string
    type: object
  rest.TooManyRequestsResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -70
      error_note:
        example: a code was sent recently, request a new one in 42 seconds
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UnauthorizedResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -20
      error_note:
        example: unauthorized
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UnprocessableContentResponse:
    properties:
      data: {}
      error_code:
        allOf:
        - $ref: '#/definitions/rest.errCode'
        example: -10
      error_note:
        example: unknown goal "flying"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/rest.statusType'
        example: Failure
    type: object
  rest.UpdateActivityRequest:
    properties:
      description_ru:
        example: Сортируйте камни по цвету
        type: string
      description_uz:
        example: Toshlarni rangi bo'yicha saralang
        type: string
      duration_minutes:
        example: 10
        maximum: 60
        minimum: 1
        type: integer
      goal:
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        example: cognitive
        type: string
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        maximum: 6
        minimum: 2
        type: integer
      min_age:
        example: 3
        maximum: 6
        minimum: 2
        type: integer
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
    type: object
  rest.UpdateProfileRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.UpdateUserRequest:
    properties:
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.VerifyOTPRequest:
    properties:
      code:
        example: "480569"
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      purpose:
        enum:
        - sign_up
        - update_user
        - reset_password
        example: sign_up
        type: string
    type: object
  rest.accessTokenView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 86400
        type: integer
    type: object
  rest.activityListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.activityView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  rest.activityView:
    properties:
      created_at:
        type: string
      description_ru:
        type: string
      description_uz:
        type: string
      duration_minutes:
        example: 10
        type: integer
      goal:
        example: cognitive
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      is_published:
        example: true
        type: boolean
      max_age:
        example: 5
        type: integer
      min_age:
        example: 3
        type: integer
      title_ru:
        example: Цветные камни
        type: string
      title_uz:
        example: Rangli toshlar
        type: string
      updated_at:
        type: string
    type: object
  rest.childListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.childView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 2
        type: integer
    type: object
  rest.childView:
    properties:
      age:
        example: 4
        type: integer
      created_at:
        type: string
      gender:
        example: male
        type: string
      id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      name:
        example: Amir
        type: string
      photo_id:
        example: 5d2f8a90-1c3b-4e6f-8a7d-9b0c1d2e3f4a
        type: string
      updated_at:
        type: string
    type: object
  rest.completionListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.completionView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 12
        type: integer
    type: object
  rest.completionView:
    properties:
      activity_id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      child_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      completed_on:
        example: "2026-10-03"
        type: string
      created_at:
        type: string
      id:
        example: 5d2f8a90-1c3b-4e6f-8a7d-9b0c1d2e3f4a
        type: string
      note:
        example: Qizil rangni birinchi topdi
        type: string
      user_id:
        example: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
        type: string
    type: object
  rest.errCode:
    enum:
    - 0
    - -10
    - -11
    - -20
    - -21
    - -30
    - -40
    - -50
    - -60
    - -70
    type: integer
    x-enum-comments:
      _errCodeBadRequest: for http 400
      _errCodeConflict: for http 409
      _errCodeForbidden: for http 403
      _errCodeInternalErr: for http 500
      _errCodeNoError: Success code.
      _errCodeNotFound: for http 404
      _errCodeRateLimited: for http 429
      _errCodeUnauthorized: for http 401
      _errCodeUnavailable: for http 503
      _errCodeValidation: for http 422
    x-enum-descriptions:
    - Success code.
    - for http 422
    - for http 400
    - for http 401
    - for http 403
    - for http 404
    - for http 409
    - for http 500
    - for http 503
    - for http 429
    x-enum-varnames:
    - _errCodeNoError
    - _errCodeValidation
    - _errCodeBadRequest
    - _errCodeUnauthorized
    - _errCodeForbidden
    - _errCodeNotFound
    - _errCodeConflict
    - _errCodeInternalErr
    - _errCodeUnavailable
    - _errCodeRateLimited
  rest.mediaView:
    properties:
      content_type:
        example: image/jpeg
        type: string
      id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      size:
        description: bytes
        example: 183244
        type: integer
      url:
        example: https://birga-media.s3.eu-central-1.amazonaws.com/media/3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f.jpg
        type: string
    type: object
  rest.profileView:
    properties:
      created_at:
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.UserRole'
        enum:
        - user
        - paid_user
        - admin
        example: user
      updated_at:
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
  rest.sendOTPView:
    properties:
      expires_in:
        description: seconds until the code expires
        example: 180
        type: integer
      resend_in:
        description: seconds until a new code may be requested
        example: 60
        type: integer
    type: object
  rest.statusType:
    enum:
    - Success
    - Failure
    type: string
    x-enum-varnames:
    - _statusSuccess
    - _statusFailure
  rest.streakView:
    properties:
      completed_today:
        example: true
        type: boolean
      current:
        example: 3
        type: integer
      last_completed_on:
        example: "2026-10-03"
        type: string
      longest:
        example: 7
        type: integer
      this_week:
        example: 2
        type: integer
      total:
        example: 12
        type: integer
    type: object
  rest.tokenPairView:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: seconds until the access token expires
        example: 86400
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  rest.userListView:
    properties:
      items:
        items:
          $ref: '#/definitions/rest.userView'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 42
        type: integer
    type: object
  rest.userView:
    properties:
      created_at:
        type: string
      id:
        example: 7b0c1f1e-2d7a-4d8e-9a55-0f4a0d7f9c11
        type: string
      name:
        example: Dilnoza
        type: string
      phone_number:
        example: "+998901234567"
        type: string
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      updated_at:
        type: string
      username:
        example: dilnoza_95
        type: string
    type: object
info:
  contact: {}
  description: Backend for the Birga caregiver app.
  title: Birga API
  version: v1
paths:
  /health:
    get:
      description: Checks that the database is reachable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest.ServiceUnavailableResponse'
      summary: readiness probe
      tags:
      - system
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
      summary: liveness probe
      tags:
      - system
  /v1/activities:
    get:
      parameters:
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: development goal
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        in: query
        name: goal
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: lists published activities
      tags:
      - activities
  /v1/activities/{id}:
    get:
      parameters:
      - description: activity id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      summary: returns a published activity
      tags:
      - activities
  /v1/admin/activities:
    get:
      parameters:
      - description: child age in years (2..6)
        in: query
        name: age
        type: integer
      - description: development goal
        enum:
        - language
        - motor
        - cognitive
        - social
        - emotional
        in: query
        name: goal
        type: string
      - description: page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityListView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: lists all activities, including unpublished
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: |-
        - title/description are required in both Uzbek (uz) and Russian (ru)
        - goal is one of: language, motor, cognitive, social, emotional
        - min_age/max_age are child ages in years, within 2..6
      parameters:
      - description: activity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/rest.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/rest.UnprocessableContentResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: creates an activity
      tags:
      - admin
  /v1/admin/activities/{id}:
    delete:
      description: |-
        Sets deleted_at; the activity disappears from every list, get and recommendation.
        Completions that point at it are kept.
      parameters:
      - description: activity id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.R'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest.NotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/rest.InternalServerErrorResponse'
      security:
      - AdminKey: []
      summary: soft-deletes an activity
      tags:
      - admin
    get:
      parameters:
      - description: activity id (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/rest.R'
            - properties:
                data:
                  $ref: '#/definitions/rest.activityView'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest.BadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest.UnauthorizedResponse'
