      goal_id:
        example: 2b6f0cc9-0f3e-4b1a-9a7e-5d8c3e2f1a00
        type: string
      max_age:
        example: 5
        maximum: 6
        minimum: 2
        type: integer
      min_age:
        example: 2
        maximum: 6
        minimum: 2
        type: integer
      photo_id:
        example: 3f1d2c4b-8a9e-4b7c-9d2e-1a2b3c4d5e6f
        type: string
      source:
        enum:
        - test
        - admin
        - harvard
        - ai
        example: admin
        type: string
      status:
        enum:
        - published
        - in_review
        - unpublished
        example: in_review
        type: string
      tip_en:
        example: Today, offer your child a choice of two options at least 3 times.
        type: string
      tip_ru:
        example: Сегодня хотя бы 3 раза дайте ребёнку выбор из двух вариантов.
