version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 150
    funlen:
      lines: 130
      statements: 50
    gocyclo:
      # Request validation and "is this update empty" checks are long flat chains of field
      # checks; 25 still catches tangled logic.
      min-complexity: 25
    lll:
      line-length: 140
    nolintlint:
      allow-unused: false
  exclusions:
    generated: lax
    paths:
      - api/docs
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [mnd, funlen, dupl, lll, goconst, noctx, gosec, gocyclo, unparam]
      # One repository per table: the CRUD of similar tables (goals/topics, articles/posts/tips)
      # looks alike on purpose.
      - path: internal/dbstore/
        linters: [dupl]
      # The route table lists every endpoint in one place.
      - path: internal/gateways/rest/routes\.go
        linters: [funlen]
      # EXIF/TIFF parsing: byte offsets, markers and orientation values are the format's numbers.
      - path: pkg/imagevariant/exif\.go
        linters: [mnd]

formatters:
  exclusions:
    paths:
      - api/docs
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gitlab.com/loyihalar/birga/backend
