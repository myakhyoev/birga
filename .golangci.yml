version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 150
    funlen:
      lines: 130
      statements: 50
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 140
    nolintlint:
      allow-unused: false
  exclusions:
    generated: lax
    paths:
      - api/docs
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [mnd, funlen, dupl, lll, goconst, noctx, gosec]

formatters:
  exclusions:
    paths:
      - api/docs
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gitlab.com/loyihalar/birga/backend
